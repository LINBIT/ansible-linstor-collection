---
minor_changes:
  - >-
    resource - new ``layer_list`` parameter sets the layer stack of the
    resource definition in manual and autoplace modes.
  - >-
    ha_gateway - new per-target ``layer_list`` option sets the layer stack
    of iSCSI, NFS, and NVMe-oF targets, for example to add LUKS encryption.
    Targets placed with a resource group take the layers from the group.
