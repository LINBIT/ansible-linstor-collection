---
bugfixes:
  - >-
    gateway_install - write a valid ``linstor-gateway.toml`` with full
    controller URLs, including scheme and port. The template produced
    invalid TOML and a garbled address, so LINSTOR Gateway fell back to
    ``localhost:3370``.
  - >-
    gateway_install - restart linstor-gateway when ``linstor-gateway.toml``
    changes.
minor_changes:
  - >-
    gateway_install - new ``gateway_install_package_state`` variable
    (default ``present``). Set it to ``latest`` to upgrade.
