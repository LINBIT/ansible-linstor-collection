---
bugfixes:
  - >-
    roles - fix argument spec validation on ansible-core 2.19 and later when
    the ``linstor_controllers`` group is empty. A Jinja expression in the
    ``linstor_api_delegate`` description crashed the validation.
  - >-
    controller_install - select the first controller by exact hostname
    match, so hostnames that contain one another no longer confuse the
    controller start and stop selection.
minor_changes:
  - >-
    cluster_membership, controller_install, ssl_init, ha_database - fail
    with a clear message when the ``linstor_controllers`` group is empty.
