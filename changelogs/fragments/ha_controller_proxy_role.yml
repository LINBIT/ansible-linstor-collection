# SPDX-License-Identifier: MIT
---
minor_changes:
  - >-
    ha_controller_proxy - new role that runs a dedicated HAProxy instance
    (``linstor-haproxy.service``) on the controllers and forwards LINSTOR
    API and GUI traffic to the active controller. It is an alternative to a
    virtual IP that also works on routed and cloud networks, and it leaves
    the distribution ``haproxy.service`` untouched.
  - >-
    ha_database - new ``ha_database_haproxy`` variable (default ``false``)
    deploys the ``ha_controller_proxy`` role after the HA database
    conversion.
