---
minor_changes:
  - gateway_satellite - new ``gateway_satellite_resource_agents`` option chooses where the OCF resource
    agents come from, ``upstream`` from GitHub (the default, unchanged) or ``distro`` from the
    distribution ``resource-agents`` package through ``linbit.drbd_reactor.resource_agents_distro``.
    The role fails when ``distro`` is combined with ``gateway_satellite_ganesha``, since only upstream
    ``main`` has the ``ganesha-nfs`` agent. Needs ``linbit.drbd_reactor`` with
    ``reactor_install_resource_agents``.
