# SPDX-License-Identifier: MIT
---
major_changes:
  - >-
    Support LINSTOR token authentication (LINSTOR 1.34.0 and later). All
    LINSTOR API modules authenticate with the ``auth-token`` from
    ``linstor-client.conf`` or the ``auth_token`` module parameter. The
    ``auth_init``, ``auth_token``, and ``auth_token_info`` modules enable
    authentication and manage tokens.
