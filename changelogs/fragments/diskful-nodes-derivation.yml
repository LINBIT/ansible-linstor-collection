# SPDX-License-Identifier: MIT
---
breaking_changes:
  - >-
    storage_pool - a pool without ``nodes`` or ``groups`` targets every host
    in ``linstor_satellites``. The ``linstor_diskful_satellites`` and
    ``linstor_diskless_satellites`` groups no longer limit pool placement,
    so scope pools away from diskless satellites with ``nodes`` or
    ``groups``.
  - >-
    cluster_init - ``cluster_init_deploy_storage`` defaults to ``true``, and
    the HA database conversion (``cluster_init_ha_database``, default
    ``true``) no longer requires it. Set ``cluster_init_ha_database: false``
    to keep a cluster without an HA database.
minor_changes:
  - >-
    ha_database, ha_gateway - find the diskful nodes from the storage pools
    registered in LINSTOR instead of from inventory groups.
  - >-
    gateway_satellite - install the HA dependencies on every host in
    ``linstor_gateway_satellites``.
