---
minor_changes:
  - >-
    node - add ``state=evicted``, which evicts an offline node, and
    ``state=lost``, which deletes a node without contacting its satellite
    (``linstor node lost``).
  - node_info - return the node ``flags``, such as ``EVACUATE`` and ``EVICTED``.
bugfixes:
  - >-
    node - ``state=restored`` restores an evicted node. It looked only for the
    ``EVACUATE`` flag, so a node that LINSTOR's auto-evict had evicted reported
    no change and stayed evicted.
