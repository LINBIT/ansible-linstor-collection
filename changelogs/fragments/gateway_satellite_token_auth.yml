---
minor_changes:
  - >-
    gateway_install, gateway_satellite - configure LINSTOR Gateway for
    token-authenticated clusters. The daemon connects to the controller
    HTTPS endpoint, trusts the controller CA, and reads its token from the
    ``token_file`` key in ``linstor-gateway.toml``. Nodes holding a
    satellite token in ``/var/lib/linstor.d/auth.json`` use it, and other
    nodes get a dedicated token that ``gateway_satellite_token_force``
    rotates.
  - >-
    gateway_satellite - token authentication is detected from the controller
    or set with ``gateway_satellite_token_auth``. Without ``ssl_init``, the
    role trusts the controller's auto-generated certificate, or the CA in
    ``gateway_satellite_ca_cert``. Requires linstor-gateway 2.3.0 or later.
