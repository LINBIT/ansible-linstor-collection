minor_changes:
  - >
    gateway_satellite - configure the ``linstor-gateway`` daemon for a
    token-authenticated controller (LINSTOR 1.34.0). When token authentication
    is enabled, the role installs the controller CA into the operating system
    trust store and makes sure the daemon has a token. Nodes already holding
    the satellite token in ``/var/lib/linstor.d/auth.json`` use that one, and
    every other node gets a dedicated per-node token in
    ``gateway_satellite_config_dir``. Auto-detected from the controller, or
    forced with ``gateway_satellite_token_auth``. The token is created only
    when missing; ``gateway_satellite_token_force`` creates a fresh one for
    rotation.
