---
minor_changes:
  - >-
    controller_install, satellite_install, gateway_install,
    gateway_satellite, ha_controller_proxy - new ``<role>_firewalld_zone``
    variable selects the firewalld zone for the ports each role opens. Set
    it when a zone is bound to a source, because a port in the default zone
    does not apply to traffic matched into a source zone. Empty, the
    default, uses the default zone
    (https://github.com/LINBIT/ansible-linstor-collection/issues/2).
