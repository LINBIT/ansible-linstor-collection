# SPDX-License-Identifier: MIT
---
breaking_changes:
  - >-
    The ``controller_env`` filter is removed. Use the
    ``linbit.linstor.controller_env`` lookup, which returns the same
    ``LS_CONTROLLERS`` string.
minor_changes:
  - >-
    client_install - new ``linstor_client_cafile`` variable sets the CA file
    in the control node ``linstor-client.conf``.
bugfixes:
  - >-
    controller_env lookup, client_install - write the ``linstor+ssl://``
    scheme for SSL clusters instead of ``linstors://``, which python-linstor
    does not recognize. Clients connect to the HTTPS port directly instead
    of relying on the redirect from the plain port.
