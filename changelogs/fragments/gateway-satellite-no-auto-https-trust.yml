---
breaking_changes:
  - >-
    gateway_satellite - the role no longer adds the controller's
    auto-generated HTTPS certificate to the operating system trust store,
    which is not meant for internal certificates. Controller trust for the
    LINSTOR Gateway daemon moved to ``gateway_install``, which runs on every
    node with the daemon, controller-only nodes included. It installs
    ``gateway_satellite_ca_cert`` or the ``ssl_init`` CA as before, and
    otherwise passes the auto-generated certificate to the daemon alone
    through golinstor's ``LS_ROOT_CA`` in a systemd drop-in. LINSTOR Gateway
    now works with token authentication and the auto-generated certificate
    on every distribution, not only on Debian and Ubuntu.
