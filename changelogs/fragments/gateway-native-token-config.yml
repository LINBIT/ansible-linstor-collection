---
minor_changes:
  - >
    gateway_install - write the LINSTOR API token into ``linstor-gateway.toml``
    as ``token_file``, the native configuration key that linstor-gateway 2.3.0
    added. It points at the satellite token in ``/var/lib/linstor.d/auth.json``
    when the controller has distributed one to the node, and otherwise at the
    dedicated gateway token. The key is left out on a node that gets neither,
    since the daemon refuses to start on a token file it cannot read.
    Token-authenticated clusters now need linstor-gateway 2.3.0 or later.
