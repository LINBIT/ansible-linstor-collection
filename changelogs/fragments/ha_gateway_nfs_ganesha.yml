# SPDX-License-Identifier: MIT
---
minor_changes:
  - >-
    gateway_satellite - new ``gateway_satellite_ganesha`` variable (default
    ``false``) installs the NFS-Ganesha userspace NFS server with the
    ``linbit.drbd_reactor.ganesha_install`` role.
  - >-
    ha_gateway - NFS exports accept an ``implementation`` key (``kernel`` or
    ``ganesha``, default from ``ha_gateway_nfs_implementation``).
    ``ganesha`` serves the export with NFS-Ganesha and matches
    ``linstor-gateway nfs create --implementation=ganesha``.
