# SPDX-License-Identifier: MIT
---
minor_changes:
  - >-
    auth_init - new role that enables token authentication and saves the
    user token at mode ``0600`` in ``linstor-client.conf`` for the control
    node user and for root on the controllers. The role skips controllers
    older than LINSTOR 1.34.0.
  - >-
    client_install - new ``linstor_client_auth_token`` variable writes an
    ``auth-token`` entry into ``linstor-client.conf``.
  - >-
    cluster_init - new ``cluster_init_token_auth`` variable (default
    ``true``) runs the ``auth_init`` role after cluster membership
    registration.
breaking_changes:
  - >-
    cluster_init - enables token authentication by default on clusters
    running LINSTOR 1.34.0 or later. Clients that do not send a token, such
    as storage plugins without token support, get ``401`` responses. Set
    ``cluster_init_token_auth: false`` to keep token authentication off.
