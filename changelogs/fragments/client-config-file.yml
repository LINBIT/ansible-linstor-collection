---
minor_changes:
  - >-
    LINSTOR modules - add a ``config_file`` option that reads the controller list,
    auth token, and TLS certificate paths from a given ``linstor-client.conf`` in
    place of ``~/.config/linstor`` and ``/etc/linstor``. When a module runs on the
    Ansible control node, the action plugin fills the option from the
    ``linstor_client_config_file`` variable, so one inventory variable gives each
    cluster its own control node client configuration and several clusters, or
    parallel playbook runs, no longer overwrite each other's controllers and token.
  - >-
    client_install, auth_init - add ``linstor_client_config_file`` to set where the
    ``linstor-client.conf`` on the control node is written, and
    ``client_install_local_config`` to skip writing it. It defaults to ``false``
    when ``linstor_api_delegate`` points at another host, so delegating to a
    controller node leaves the control node untouched. A saved auth token is kept
    in the control node config only when the file shares a controller address with
    the inventory, so a cluster at other addresses never inherits it.
  - >-
    auth_init - ``auth_init_local_cafile`` follows ``ssl_init_local_dir`` when it
    is set.
