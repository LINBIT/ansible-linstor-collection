breaking_changes:
  - >-
    Remove ``state: query`` from the LINSTOR manage modules (``controller``,
    ``node``, ``node_interface``, ``storage_pool``, ``resource``,
    ``resource_definition``, ``resource_group``, ``volume_group``,
    ``snapshot``, ``remote``, ``schedule``, ``key_value_store``, and
    ``file``). Use the matching ``_info`` module instead.
