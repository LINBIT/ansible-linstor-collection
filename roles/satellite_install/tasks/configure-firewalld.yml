---
- name: Open firewalld ports for LINSTOR satellite
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto }}"
    zone: "{{ item.zone | default(omit, true) }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ satellite_install_firewall_ports }}"
