# SPDX-License-Identifier: MIT
galaxy_info:
  author: LINBIT
  description: Trust a peer LINSTOR cluster's CA for cross-cluster backup shipping
  company: LINBIT

  license: MIT

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble
        - resolute
    - name: EL
      versions:
        - "8"
        - "9"
        - "10"
    # Also covers openSUSE Leap 16 (missing from ansible-lint schema list)
    - name: SLES
      versions:
        - "16"

  min_ansible_version: '2.16'

  galaxy_tags:
    - linbit
    - linstor
    - storage
    - ssl
    - tls
    - backup

dependencies: []
