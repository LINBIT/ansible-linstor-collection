# SPDX-License-Identifier: MIT
---
argument_specs:
  main:
    short_description: Install and configure the LINSTOR controller
    description:
      - Install and configure the LINSTOR controller.
      - Opens firewall port C(3370/tcp) for the LINSTOR controller API.
    options:
      controller_port:
        type: int
        default: 3370
        description:
          - LINSTOR controller API port.
      controller_install_package_state:
        type: str
        default: present
        choices:
          - latest
          - present
        description:
          - Package state for LINSTOR controller packages.
          - C(latest) installs or upgrades, C(present) installs only.
      linstor_install_version:
        type: str
        default: ""
        description:
          - >-
            Pin the LINSTOR server packages (C(linstor-controller) and
            C(linstor-common)) to a version, for example C(1.33.3), and lock
            them in the OS package manager against upgrades.
          - >-
            Shared with C(satellite_install): set it once to keep controller,
            satellite, and common in lockstep. Empty installs the newest
            available.
      controller_install_gui:
        type: bool
        default: true
        description:
          - Install the C(linstor-gui) web UI alongside C(linstor-controller).
          - Set C(false) to skip the GUI package.
      controller_install_firewall_rules:
        type: bool
        default: true
        description:
          - Manage firewall rules for LINSTOR controller ports.
          - Set C(false) to skip firewall configuration.
      controller_install_firewalld_zone:
        type: str
        default: ""
        description:
          - firewalld zone to open the LINSTOR controller ports in.
          - Empty uses the zone firewalld would pick by itself, which is
            the default zone. Set it when a zone is bound to a source,
            because firewalld matches a source before an interface.
          - Ignored by UFW, which has no zones.
      controller_install_firewall_ports:
        type: list
        elements: dict
        default:
          - port: "3370"
            proto: tcp
        description:
          - Ports to open in firewalld or UFW for the LINSTOR controller.
      controller_install_force_reconfigure:
        type: bool
        default: false
        description:
          - >-
            Force re-running the configure phase even when the LINSTOR
            controller package install reports unchanged.
          - >-
            Re-asserts firewall ports and controller service state
            (HA-aware restart, stop, or start as appropriate).
          - >-
            On a running cluster, the C(Restart LINSTOR controller service
            when already running and updated) task fires unconditionally,
            briefly restarting the active controller.
          - >-
            Use deliberately for drift correction; not recommended on
            production clusters without an outage window.
      controller_install_db_type:
        type: str
        default: h2
        description:
          - >-
            Database for the controller: C(h2), C(mariadb), C(mysql), or
            C(postgresql), in any case.
          - >-
            C(h2) keeps the controller's built-in database and leaves
            C(/etc/linstor/linstor.toml) alone.
          - >-
            The other types connect to an existing database. The role builds
            the JDBC URL from O(controller_install_db_host),
            O(controller_install_db_port), and O(controller_install_db_name),
            and writes it with the user and password to the C([db]) section of
            C(/etc/linstor/linstor.toml) before the package install, because
            the controller creates its database on first start.
          - >-
            The database and its user must exist, and the controller creates
            its tables.
          - >-
            On an installed controller, a changed user or password restarts
            the running controller. A changed URL fails unless
            O(controller_install_db_force) is set, because it does not move
            the cluster's data.
      controller_install_db_host:
        type: str
        default: ""
        description:
          - Host name or IP address of the database, required for every type but C(h2).
      controller_install_db_port:
        type: int
        description:
          - >-
            Database port. Defaults to C(3306) for C(mariadb) and C(mysql),
            and C(5432) for C(postgresql).
      controller_install_db_name:
        type: str
        default: linstor
        description:
          - Database name.
      controller_install_db_user:
        type: str
        default: ""
        description:
          - Database user, required for every type but C(h2).
      controller_install_db_password:
        type: str
        default: ""
        description:
          - Database password.
      controller_install_db_wait_timeout:
        type: int
        default: 30
        description:
          - >-
            Seconds to wait for a MariaDB, MySQL, or PostgreSQL database to
            accept connections before the controller starts.
      controller_install_db_force:
        type: bool
        default: false
        description:
          - >-
            Switch an installed controller to a different database URL, built
            from O(controller_install_db_type), O(controller_install_db_host),
            O(controller_install_db_port), and O(controller_install_db_name),
            and restart it on that database if it is running.
          - >-
            Only an installed controller needs it. A first install writes the
            URL without it, because the controller has no data yet.
          - >-
            The target database must already hold the cluster's data, for
            example moved there with C(linstor-database export-db) and
            C(import-db). On an empty database the controller starts with
            no nodes or resources.
