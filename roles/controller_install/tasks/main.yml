# SPDX-License-Identifier: MIT
---
# tasks file for linstor_controller
- name: Assert the linstor_controllers group has at least one host
  ansible.builtin.assert:
    that: groups.get('linstor_controllers', []) | length > 0
    fail_msg: >-
      The linstor_controllers inventory group is empty. Define at least one
      controller host before running controller_install.
    quiet: true
  run_once: true  # noqa: run-once[task]

- name: Gather OS facts for OS-specific vars
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - min
  when: ansible_facts['os_family'] is not defined

- name: Check if linstor-controller is already installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/linstor-controller.service
  register: _controller_install_check

- name: Gather installed package versions
  ansible.builtin.package_facts:
  when: linstor_install_version | default('') | length > 0

- name: Check whether the pinned LINSTOR controller version is installed
  ansible.builtin.set_fact:
    _controller_install_pin_installed: >-
      {{ linstor_install_version | default('') | length > 0
         and _controller_install_evr.startswith(linstor_install_version) }}
  vars:
    _controller_install_pkg: "{{ (ansible_facts['packages'] | default({})).get('linstor-controller', [{}]) | first }}"
    _controller_install_evr: >-
      {{ _controller_install_pkg['version'] | default('')
         ~ ('-' ~ _controller_install_pkg['release'] if _controller_install_pkg['release'] is defined else '') }}

- name: Build LINSTOR controller package list
  ansible.builtin.set_fact:
    _controller_install_packages_list: >-
      {{ ['linstor-controller']
         + (['linstor-gui'] if controller_install_gui | bool else []) }}

# The controller creates its database on first start, and Debian starts it on package install
- name: Configure the LINSTOR controller database
  ansible.builtin.include_tasks: configure-database.yml
  when: controller_install_db_type | lower != 'h2'

# The controller creates the master passphrase on first start when linstor.toml holds one
- name: Configure the LINSTOR master passphrase
  ansible.builtin.include_tasks: configure-passphrase.yml
  when: linstor_master_passphrase | default('') | length > 0

- name: Install LINSTOR controller
  when:
    - not _controller_install_check.stat.exists
      or controller_install_package_state != 'present'
      or linstor_install_version | default('') | length > 0
  block:
    - name: Unlock LINSTOR controller package versions
      ansible.builtin.include_tasks: "unlock-{{ ansible_facts['os_family'] | lower }}.yml"
      when: not _controller_install_pin_installed

    - name: Pin LINSTOR controller package versions
      ansible.builtin.include_tasks: "pin-version-{{ ansible_facts['os_family'] | lower }}.yml"
      when: linstor_install_version | default('') | length > 0

    # Controllers that start together on an empty shared database leave it half-initialized
    - name: Keep the package install from starting the LINSTOR controller (APT)
      ansible.builtin.copy:
        dest: /usr/sbin/policy-rc.d
        content: |
          #!/bin/sh
          case "$1" in linstor-controller|linstor-controller.service) exit 101 ;; esac
          exit 0
        mode: '0755'
        force: false
      when:
        - ansible_facts['os_family'] | lower == 'debian'
        - controller_install_db_type | lower != 'h2'
        - groups['linstor_controllers'] | length > 1
        - not _controller_install_check.stat.exists
      register: _controller_install_policy_rc

    - name: Install LINSTOR controller packages
      ansible.builtin.package:
        name: "{{ _controller_install_packages_list }}"
        state: "{{ controller_install_package_state }}"
      register: _controller_install_packages
      until: _controller_install_packages is succeeded
      retries: 3

    # Unlock by hand to change the version, rerunning the role does not move this lock
    - name: Lock LINSTOR controller package versions
      ansible.builtin.include_tasks: "lock-{{ ansible_facts['os_family'] | lower }}.yml"
      when:
        - linstor_install_version | default('') | length > 0
        - not ansible_check_mode
  always:
    - name: Let the package manager start services again (APT) # noqa: no-handler
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: _controller_install_policy_rc is changed

- name: Configure LINSTOR controller # noqa: no-handler
  ansible.builtin.include_tasks: configure-controller.yml
  when:
    (_controller_install_packages | default({}) is changed) or
    (controller_install_force_reconfigure | bool)
