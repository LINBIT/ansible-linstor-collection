# SPDX-License-Identifier: MIT
---
argument_specs:
  main:
    short_description: Create LINSTOR storage pools on diskful satellites
    description:
      - Create LINSTOR storage pools on diskful satellite nodes.
      - Supports all LINSTOR storage pool driver types.
      - >-
        The role loops over the O(linstor_storage_pools) inventory variable and creates the underlying
        storage before registering each pool with LINSTOR.
      - >-
        Each satellite creates the pools that target it; a satellite no pool targets is left diskless.
    options:
      linstor_storage_pools:
        type: list
        elements: dict
        default: []
        description:
          - List of pool definitions, typically defined in inventory.
          - >-
            Each item supports keys: C(name) (required), C(type), C(vg), C(vg_thinpool), C(zpool),
            C(wss), C(physical_devices), C(file_path), C(thinpool_size), C(pv_create_options),
            C(lv_create_options), C(zfs_create_options), C(zpool_vdev_type), C(zpool_properties),
            C(vdevs), C(wipefs_force), C(vdo), C(vdo_logical_size), C(vdo_slab_size), C(raid).
          - >-
            C(vdevs) (zfs and zfsthin) is an optional list of additional vdevs appended to the pool at
            creation time, each a dict with C(disks) (required), optional C(type), and optional C(role)
            (C(log), C(cache), C(spare), C(dedup), C(special)). Use it for SLOG, special, and cache vdevs
            alongside the C(physical_devices) data vdev.
          - >-
            C(wss) (storagespaces and storagespaces_thin) is the Windows Storage Spaces pool friendly
            name, required for those types. The role creates the Storage Spaces pool from the
            C(physical_devices) entries, which match the unique disk identifiers DeviceId,
            SerialNumber, or UniqueId. Listed disks carrying old partitions are cleared before
            pooling; boot and system disks are refused. The thick and thin distinction lives in
            the LINSTOR driver, not in the pool.
          - >-
            C(vdo) (lvmthin only) builds the thin pool on an LVM VDO volume, which deduplicates and
            compresses the data of every LINSTOR volume in the pool. The role creates the VDO volume
            with C(thinpool_size) as its physical size and C(vdo_logical_size) as its logical size,
            then converts it into the thin pool. The node needs LVM 2.03.24 or newer, C(vdoformat),
            and the C(dm-vdo) or C(kvdo) kernel module. C(satellite_install_vdo) in
            C(linbit.linstor.satellite_install) installs C(vdoformat) and the kernel module.
          - >-
            C(vdo_logical_size) is the thin pool size that LINSTOR reports, for example C(100G).
            C(vdo_slab_size) is the VDO slab size, a power of two from C(128M) to C(32G). As in
            C(linstor physical-storage create-device-pool), an empty value keeps the LVM default,
            which for the logical size is the largest size that fits the physical size without
            deduplication or compression. Set the logical size larger than the physical size to use
            the space that deduplication and compression save.
          - >-
            C(raid) (lvmthin only) stores the thin pool data on LVM RAID across all
            C(physical_devices): C(raid1) (2 or more devices), C(raid5) (3 or more), C(raid6) (5 or
            more), or C(raid10) (4 or more, an even number). The role derives the LVM options from the
            number of devices and appends C(lv_create_options). For C(raid5) and C(raid6), it scales a
            percentage C(thinpool_size) by the share of data devices, because LVM applies the
            percentage to the data and adds the parity on top. With C(vdo), the VDO volume sits on
            the RAID volume.
          - >-
            C(type: diskless) registers a custom diskless pool. The role creates no storage on the
            node, so C(physical_devices) is not required.
          - >-
            Optional targeting keys: C(nodes) (list of inventory hostnames) and C(groups) (list of inventory
            group names). When set, the pool is created only on hosts that match. When both are set, the
            union is used. When neither is set, the pool targets all C(linstor_satellites).
      storage_pool_defaults:
        type: dict
        description:
          - Dict providing fallback values for omitted keys in each pool item.
          - Override this dict to change defaults globally.
          - See C(defaults/main.yml) for the full default dict.
      linstor_api_delegate:
        type: str
        required: false
        default: localhost
        description:
          - Delegation target for LINSTOR API tasks (python-linstor module calls).
          - Default C(localhost) runs the calls on the Ansible control node.
          - Override to a cluster node when the Ansible control node cannot directly reach the
            LINSTOR controller API endpoint (for example an SSH jump host
            or a segmented management network).
          - "Common override: the first host in the C(linstor_controllers) inventory group."
          - The delegated node must have C(python-linstor) installed.
            Cluster nodes have it via LINSTOR package dependencies.
