# SPDX-License-Identifier: MIT
---
- name: Filter pools for this host
  ansible.builtin.set_fact:
    _my_pools: >-
      {{ linstor_storage_pools | default([])
         | linbit.linstor.host_storage_pools(inventory_hostname, groups) }}

- name: Check if storage pool exists
  linbit.linstor.storage_pool_info:
    name: "{{ _pool.name }}"
    node: "{{ inventory_hostname }}"
  when: _storage_pool_has_pools | bool
  delegate_to: "{{ linstor_api_delegate }}"
  environment:
    LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"
  loop: "{{ _my_pools }}"
  loop_control:
    loop_var: _pool
    label: "{{ _pool.name }}"
  register: _storage_pool_checks

# Build enriched list with computed _type for downstream filtering.
# Using a loop with set_fact so each host builds its own list in parallel.
- name: Initialize pool creation list
  ansible.builtin.set_fact:
    _pools_to_create: []
  when: _storage_pool_has_pools | bool

- name: Build pool creation list
  ansible.builtin.set_fact:
    _pools_to_create: >-
      {{ _pools_to_create +
         [_check._pool | combine({
           '_type': _check._pool.type | default(storage_pool_defaults.type),
           '_vdo': _check._pool.vdo | default(storage_pool_defaults.vdo | default(false)) | bool,
           '_raid': _check._pool.raid | default(storage_pool_defaults.raid | default('')) | string | lower
         })] }}
  when:
    - _storage_pool_has_pools | bool
    - _check.storage_pools | default([]) | length == 0
  loop: "{{ _storage_pool_checks.results | default([]) }}"
  loop_control:
    loop_var: _check
    label: "{{ _check._pool.name }}"

# --- Validation ---

- name: Assert pool name is set
  ansible.builtin.assert:
    that: item.name is defined and item.name | length > 0
    fail_msg: "Each storage pool must have a 'name' key"
    quiet: true
  when: _storage_pool_has_pools | bool
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Assert pool type is valid
  ansible.builtin.assert:
    that: item._type in ['lvm', 'lvmthin', 'zfs', 'zfsthin', 'file', 'filethin', 'spdk', 'remote_spdk', 'storagespaces', 'storagespaces_thin', 'diskless']
    fail_msg: "storage pool type '{{ item._type }}' is not a valid LINSTOR storage pool driver"
    quiet: true
  when: _storage_pool_has_pools | bool
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert physical_devices is set
  ansible.builtin.assert:
    that: item.physical_devices is defined and item.physical_devices | length > 0
    fail_msg: "physical_devices must be set for type '{{ item._type }}'"
    quiet: true
  when:
    - _storage_pool_has_pools | bool
    - item._type not in ['file', 'filethin', 'diskless']
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert vg is set
  ansible.builtin.assert:
    that: item.vg is defined and item.vg | length > 0
    fail_msg: "vg must be set for type '{{ item._type }}'"
    quiet: true
  when:
    - _storage_pool_has_pools | bool
    - item._type in ['lvm', 'lvmthin']
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert zpool is set
  ansible.builtin.assert:
    that: item.zpool is defined and item.zpool | length > 0
    fail_msg: "zpool must be set for type '{{ item._type }}'"
    quiet: true
  when:
    - _storage_pool_has_pools | bool
    - item._type in ['zfs', 'zfsthin']
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert wss is set
  ansible.builtin.assert:
    that: item.wss is defined and item.wss | length > 0
    fail_msg: "wss must be set for type '{{ item._type }}'"
    quiet: true
  when:
    - _storage_pool_has_pools | bool
    - item._type in ['storagespaces', 'storagespaces_thin']
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert vg_thinpool is set
  ansible.builtin.assert:
    that: (item.vg_thinpool | default(storage_pool_defaults.vg_thinpool)) | length > 0
    fail_msg: "vg_thinpool must be set for type 'lvmthin'"
    quiet: true
  when:
    - _storage_pool_has_pools | bool
    - item._type == 'lvmthin'
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert VDO keys are only used on VDO lvmthin pools
  ansible.builtin.assert:
    that:
      - not item._vdo or item._type == 'lvmthin'
      - item._vdo or (item.vdo_logical_size | default('') | string | length == 0
        and item.vdo_slab_size | default('') | string | length == 0)
    fail_msg: >-
      Storage pool '{{ item.name }}': vdo is only supported on type 'lvmthin',
      and vdo_logical_size and vdo_slab_size need vdo: true
    quiet: true
  when: _storage_pool_has_pools | bool
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert RAID settings fit the pool
  ansible.builtin.assert:
    that:
      - item._raid in ['', 'raid1', 'raid5', 'raid6', 'raid10']
      - item._raid == '' or item._type == 'lvmthin'
      - item._raid == '' or item.physical_devices | length >= _min_devices.get(item._raid, 0)
      - item._raid != 'raid10' or item.physical_devices | length is even
    fail_msg: >-
      Storage pool '{{ item.name }}': raid takes raid1 (2 or more physical_devices), raid5 (3 or more),
      raid6 (5 or more), or raid10 (an even number, 4 or more), on type 'lvmthin'
    quiet: true
  vars:
    _min_devices: { raid1: 2, raid5: 3, raid6: 5, raid10: 4 }
  when: _storage_pool_has_pools | bool
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# --- ZFS prerequisites ---

- name: Check for ZFS
  ansible.builtin.stat:
    path: "{{ _storage_pool_zfs_path }}"
  when:
    - _storage_pool_has_pools | bool
    - _pools_to_create | default([]) | selectattr('_type', 'in', ['zfs', 'zfsthin']) | list | length > 0
  register: _storage_pool_zfs_check

- name: Halt if ZFS is not installed
  ansible.builtin.fail:
    msg: >-
      ZFS is not installed ({{ _storage_pool_zfs_path }} not found).
      Install ZFS for ZFS-backed storage pools, or set
      `satellite_install_zfs: true` in linbit.linstor.satellite_install.
  when:
    - _storage_pool_has_pools | bool
    - _pools_to_create | default([]) | selectattr('_type', 'in', ['zfs', 'zfsthin']) | list | length > 0
    - not (_storage_pool_zfs_check.stat.exists | default(true))

# --- VDO prerequisites ---

# LVM runs vdoformat from this path (lvm.conf global/vdo_format_executable)
- name: Check for vdoformat
  ansible.builtin.stat:
    path: /usr/bin/vdoformat
  when: _storage_pool_has_vdo_pools | bool
  register: _storage_pool_vdoformat_check

- name: Check for the VDO kernel module
  ansible.builtin.shell:
    cmd: modinfo dm-vdo || modinfo kvdo
  when: _storage_pool_has_vdo_pools | bool
  register: _storage_pool_vdo_module_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Halt if VDO is not installed
  ansible.builtin.fail:
    msg: >-
      VDO is not installed
      ({{ (([] if _storage_pool_vdoformat_check.stat.exists else ['/usr/bin/vdoformat not found'])
          + ([] if _storage_pool_vdo_module_check.rc == 0 else ['no dm-vdo or kvdo kernel module']))
          | join(', ') }}).
      Install VDO for VDO-backed storage pools, or set
      `satellite_install_vdo: true` in linbit.linstor.satellite_install.
  when:
    - _storage_pool_has_vdo_pools | bool
    - not _storage_pool_vdoformat_check.stat.exists or _storage_pool_vdo_module_check.rc != 0

- name: Read the LVM version
  ansible.builtin.command:
    cmd: lvm version
  when: _storage_pool_has_vdo_pools | bool
  register: _storage_pool_lvm_version
  changed_when: false
  check_mode: false

- name: List the LVM segment types
  ansible.builtin.command:
    cmd: lvm segtypes
  when: _storage_pool_has_vdo_pools | bool
  register: _storage_pool_lvm_segtypes
  changed_when: false
  check_mode: false

- name: Halt if LVM cannot build a thin pool on VDO
  ansible.builtin.fail:
    msg: >-
      LVM {{ _lvm_version }} cannot build a thin pool on VDO.
      It needs LVM 2.03.24 or newer, built with VDO support (vdo in `lvm segtypes`).
  vars:
    _lvm_version_line: "{{ _storage_pool_lvm_version.stdout_lines | select('search', 'LVM version') | first }}"
    _lvm_version: "{{ _lvm_version_line.split(':')[1] | trim | split('(') | first }}"
  when:
    - _storage_pool_has_vdo_pools | bool
    - _lvm_version is version('2.03.24', '<')
      or 'vdo' not in (_storage_pool_lvm_segtypes.stdout_lines | map('trim') | list)

# --- Create storage backends ---
# Each type file loops internally over the relevant pools from _pools_to_create.
# This allows all hosts to execute each task in parallel (no include_tasks loop).

- name: Create file storage pools
  ansible.builtin.include_tasks: file.yml
  when:
    - _storage_pool_has_pools | bool
    - _pools_to_create | default([]) | selectattr('_type', 'in', ['file', 'filethin']) | list | length > 0

- name: Create LVM storage pools
  ansible.builtin.include_tasks: lvm.yml
  when:
    - _storage_pool_has_pools | bool
    - _pools_to_create | default([]) | selectattr('_type', 'in', ['lvm', 'lvmthin']) | list | length > 0

- name: Create ZFS storage pools
  ansible.builtin.include_tasks: zfs.yml
  when:
    - _storage_pool_has_pools | bool
    - _pools_to_create | default([]) | selectattr('_type', 'in', ['zfs', 'zfsthin']) | list | length > 0

- name: Create Windows Storage Spaces pools
  ansible.builtin.include_tasks: storagespaces.yml
  when:
    - _storage_pool_has_pools | bool
    - _pools_to_create | default([]) | selectattr('_type', 'in', ['storagespaces', 'storagespaces_thin']) | list | length > 0

# --- Register pools with LINSTOR ---

- name: Create LINSTOR storage pool
  linbit.linstor.storage_pool:
    name: "{{ item.name }}"
    node: "{{ inventory_hostname }}"
    driver: "{{ item._type }}"
    driver_pool: "{{ (_sp_driver_pool | trim) or omit }}"
    properties: "{{ _sp_properties }}"
  vars:
    _sp_driver_pool: >-
      {{ (item.file_path | default(storage_pool_defaults.file_path))
         if item._type in ['file', 'filethin']
         else (item.vg ~ '/' ~ (item.vg_thinpool | default(storage_pool_defaults.vg_thinpool)))
         if item._type == 'lvmthin'
         else item.zpool
         if item._type in ['zfs', 'zfsthin']
         else item.wss
         if item._type in ['storagespaces', 'storagespaces_thin']
         else ''
         if item._type == 'diskless'
         else item.vg }}
    _sp_custom_opts: "{{ (item.lv_create_options | default(storage_pool_defaults.lv_create_options)) | trim }}"
    _sp_stripe_opts: >-
      {%- if (item.physical_devices | default([]) | length) > 1 -%}
        -i {{ item.physical_devices | default([]) | length }} -I 64
      {%- endif -%}
    _sp_lv_opts: "{{ _sp_custom_opts or _sp_stripe_opts }}"
    _sp_properties: >-
      {{ {}
        | combine({'StorDriver/LvcreateOptions': _sp_lv_opts}
          if item._type == 'lvm' and _sp_lv_opts else {})
        | combine({'StorDriver/ZfscreateOptions': (item.zfs_create_options
          | default(storage_pool_defaults.zfs_create_options)) | trim}
          if item._type in ['zfs', 'zfsthin'] and (item.zfs_create_options
          | default(storage_pool_defaults.zfs_create_options)) | trim != '' else {})
      }}
  when: _storage_pool_has_pools | bool
  delegate_to: "{{ linstor_api_delegate }}"
  environment:
    LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"
  loop: "{{ _pools_to_create | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  retries: 3
  delay: 5
