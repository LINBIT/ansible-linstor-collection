# SPDX-License-Identifier: MIT
---
- name: Regather hardware facts for LVM
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - hardware

- name: List mount points on storage pool backing disks
  ansible.builtin.command: lsblk --noheadings --raw --output MOUNTPOINT {{ item.1 }}
  when:
    (item.0.vg not in ansible_facts['lvm']['vgs']) or
    (item.0.wipefs_force | default(storage_pool_defaults.wipefs_force) | bool)
  register: _lvm_wipe_mounts
  changed_when: false
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'in', ['lvm', 'lvmthin'])
       | list
       | subelements('physical_devices') }}
  loop_control:
    label: "{{ item.0.name }} - {{ item.1 }}"

- name: Refuse to wipe a disk with a mounted filesystem
  ansible.builtin.fail:
    msg: "Refusing to run wipefs on {{ item.item.1 }}: mounted at {{ item.stdout_lines | select | join(', ') }}. Unmount it first, or pick another disk."
  when: item.stdout_lines | select | list | length > 0
  loop: "{{ _lvm_wipe_mounts.results | selectattr('stdout_lines', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.1 }}"

# Don't wipe out physical volumes if the volume group is already enumerated
- name: Run wipefs on storage pool backing disks
  ansible.builtin.command: wipefs -afq {{ item.1 }}
  when:
    (item.0.vg not in ansible_facts['lvm']['vgs']) or
    (item.0.wipefs_force | default(storage_pool_defaults.wipefs_force) | bool)
  changed_when: true
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'in', ['lvm', 'lvmthin'])
       | list
       | subelements('physical_devices') }}
  loop_control:
    label: "{{ item.0.name }} - {{ item.1 }}"

- name: Create LVM volume group for LINSTOR
  community.general.lvg:
    vg: "{{ item.vg }}"
    pvs: "{{ item.physical_devices }}"
    pv_options: "{{ item.pv_create_options | default(storage_pool_defaults.pv_create_options) }}"
    remove_extra_pvs: false
    state: present
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'in', ['lvm', 'lvmthin'])
       | list }}
  loop_control:
    label: "{{ item.name }}"

# lvol cannot build a thin pool on VDO or RAID, and would resize a converted pool on reruns
- name: List logical volumes for VDO and RAID thin pools
  ansible.builtin.command:
    cmd: lvs --all --noheadings --separator , --options lv_name,segtype {{ item.vg }}
  register: _storage_pool_convert_lvs
  changed_when: false
  failed_when: false
  check_mode: false
  loop: >-
    {{ (_lvmthin_pools | selectattr('_vdo') | list)
       + (_lvmthin_pools | rejectattr('_vdo') | rejectattr('_raid', 'equalto', '') | list) }}
  vars:
    _lvmthin_pools: "{{ _pools_to_create | selectattr('_type', 'equalto', 'lvmthin') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Initialize VDO and RAID thin pool list
  ansible.builtin.set_fact:
    _storage_pool_convert_thinpools: []

- name: Build VDO and RAID thin pool list
  ansible.builtin.set_fact:
    _storage_pool_convert_thinpools: >-
      {{ _storage_pool_convert_thinpools + [item.item | combine({
           '_thinpool': _thinpool,
           '_segtype': _segtypes.get(_thinpool, ''),
           '_data_segtype': _segtypes.get(_thinpool ~ '_tdata', ''),
           '_pool_segtype': _segtypes.get(_thinpool ~ '_vpool0', ''),
           '_vdata_segtype': _segtypes.get(_thinpool ~ '_vpool0_vdata', ''),
           '_size_opts': ('--extents ' if '%' in _scaled_size else '--size ') ~ _scaled_size,
           '_vdo_opts': [_logical_size_opt, _slab_size_opt] | select | join(' '),
           '_lv_opts': ([_raid_opts, _custom_opts] | select | join(' ')) if item.item._raid else (_custom_opts or _stripe_opts)
         })] }}
  vars:
    _thinpool: "{{ item.item.vg_thinpool | default(storage_pool_defaults.vg_thinpool) }}"
    _segtypes: "{{ dict(item.stdout_lines | map('trim') | map('replace', '[', '') | map('replace', ']', '') | map('split', ',')) }}"
    _size: "{{ item.item.thinpool_size | default(storage_pool_defaults.thinpool_size) }}"
    _logical_size: "{{ item.item.vdo_logical_size | default(storage_pool_defaults.vdo_logical_size | default('')) | string }}"
    _logical_size_opt: "{{ ('--virtualsize ' ~ _logical_size) if _logical_size | length > 0 else '' }}"
    _slab_size: "{{ item.item.vdo_slab_size | default(storage_pool_defaults.vdo_slab_size | default('')) | string }}"
    _slab_size_opt: "{{ ('--vdosettings slab_size_mb=' ~ ((_slab_size | human_to_bytes) // 1048576)) if _slab_size | length > 0 else '' }}"
    _custom_opts: "{{ (item.item.lv_create_options | default(storage_pool_defaults.lv_create_options)) | trim }}"
    _stripe_opts: "{{ ('-i ' ~ (item.item.physical_devices | length | string) ~ ' -I 64') if item.item.physical_devices | length > 1 else '' }}"
    _devices: "{{ item.item.physical_devices | length }}"
    _raid_opts: >-
      {{ {'raid1': '--type raid1 -m ' ~ (_devices | int - 1),
          'raid5': '--type raid5 -i ' ~ (_devices | int - 1),
          'raid6': '--type raid6 -i ' ~ (_devices | int - 2),
          'raid10': '--type raid10 -i ' ~ (_devices | int // 2) ~ ' -m 1'}.get(item.item._raid, '') }}
    _parity: "{{ {'raid5': 1, 'raid6': 2}.get(item.item._raid, 0) }}"
    _scaled_size: >-
      {{ ((_size.split('%')[0] | int * (_devices | int - _parity | int) // _devices | int) ~ '%' ~ _size.split('%')[1])
         if _parity | int > 0 and _size is match('^[0-9]+%') else _size }}
  loop: "{{ _storage_pool_convert_lvs.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Refuse a VDO thin pool name taken by a volume without VDO
  ansible.builtin.fail:
    msg: >-
      {{ item.vg }}/{{ item._thinpool }} already exists as {{ item._segtype }} without VDO.
      Remove it, or set another vg_thinpool for storage pool '{{ item.name }}'.
  when:
    - item._vdo
    - item._segtype not in ['', 'vdo']
    - item._segtype != 'thin-pool' or item._data_segtype != 'vdo'
  loop: "{{ _storage_pool_convert_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Refuse a VDO thin pool on another RAID level
  ansible.builtin.fail:
    msg: >-
      {{ item.vg }}/{{ item._thinpool }} already exists with VDO on {{ _vdo_data_segtype }}, not {{ item._raid }}.
      Remove it, or set another vg_thinpool for storage pool '{{ item.name }}'.
  when:
    - item._vdo
    - item._raid != ''
    - _vdo_data_segtype not in ['', item._raid]
  vars:
    _vdo_data_segtype: "{{ item._vdata_segtype if item._pool_segtype == 'vdo-pool' else item._pool_segtype }}"
  loop: "{{ _storage_pool_convert_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Refuse a RAID thin pool name taken by another volume
  ansible.builtin.fail:
    msg: >-
      {{ item.vg }}/{{ item._thinpool }} already exists and is not a {{ item._raid }} volume or thin pool.
      Remove it, or set another vg_thinpool for storage pool '{{ item.name }}'.
  when:
    - not item._vdo
    - item._segtype not in ['', item._raid]
    - item._segtype != 'thin-pool' or item._data_segtype != item._raid
  loop: "{{ _storage_pool_convert_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

# Stripe volumes by default when more than 1 device exists.
# Each vars expression uses a single {{ }} output to avoid jinja2_native
# returning None for empty >- block scalar templates.
- name: Create LVM thin pool for LINSTOR
  community.general.lvol:
    vg: "{{ item.vg }}"
    thinpool: "{{ item.vg_thinpool | default(storage_pool_defaults.vg_thinpool) }}"
    size: "{{ item.thinpool_size | default(storage_pool_defaults.thinpool_size) }}"
    opts: "{{ _lv_opts or omit }}"
    shrink: false
  vars:
    _custom_opts: "{{ (item.lv_create_options | default(storage_pool_defaults.lv_create_options)) | trim }}"
    _stripe_opts: "{{ ('-i ' ~ (item.physical_devices | length | string) ~ ' -I 64') if item.physical_devices | length > 1 else '' }}"
    _lv_opts: "{{ _custom_opts or _stripe_opts }}"
  when: not ansible_check_mode or item.vg in ansible_facts['lvm']['vgs']
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'equalto', 'lvmthin')
       | rejectattr('_vdo')
       | selectattr('_raid', 'equalto', '')
       | list }}
  loop_control:
    label: "{{ item.name }}"

- name: Create VDO volume for LINSTOR thin pool
  ansible.builtin.command:
    cmd: >-
      lvcreate --yes --type vdo --name {{ item._thinpool }} --vdopool {{ item._thinpool }}_vpool0
      {{ item._size_opts }} {{ item._vdo_opts }} {{ item.vg }}
  when:
    - item._vdo
    - item._segtype == ''
    - item._lv_opts == ''
  changed_when: true
  loop: "{{ _storage_pool_convert_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

# lvcreate --type vdo drops the stripe size but keeps the stripe count, which the kernel rejects
- name: Create data volume with LV options for VDO volume
  ansible.builtin.command:
    cmd: >-
      lvcreate --yes --name {{ item._thinpool }}_vpool0
      {{ item._size_opts }} {{ item._lv_opts }} {{ item.vg }}
  when:
    - item._vdo
    - item._segtype == ''
    - item._lv_opts != ''
    - item._pool_segtype == ''
  changed_when: true
  loop: "{{ _storage_pool_convert_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Convert data volume to VDO volume
  ansible.builtin.command:
    cmd: >-
      lvconvert --yes --type vdo-pool --name {{ item._thinpool }}
      {{ item._vdo_opts }} {{ item.vg }}/{{ item._thinpool }}_vpool0
  when:
    - item._vdo
    - item._segtype == ''
    - item._lv_opts != ''
  changed_when: true
  loop: "{{ _storage_pool_convert_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create RAID volume for LINSTOR thin pool
  ansible.builtin.command:
    cmd: >-
      lvcreate --yes --name {{ item._thinpool }}
      {{ item._size_opts }} {{ item._lv_opts }} {{ item.vg }}
  when:
    - not item._vdo
    - item._segtype == ''
  changed_when: true
  loop: "{{ _storage_pool_convert_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Convert VDO or RAID volume to LINSTOR thin pool
  ansible.builtin.command:
    cmd: lvconvert --yes --type thin-pool {{ item.vg }}/{{ item._thinpool }}
  when: >-
    item._segtype in ['', 'vdo'] if item._vdo
    else item._segtype in ['', item._raid]
  changed_when: true
  loop: "{{ _storage_pool_convert_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

# dm-thin passes discards down only when VDO accepts a whole chunk, and VDO accepts one 4 KiB block by default
- name: Read chunk size, VDO discard limit, and active thin volumes of VDO thin pools
  ansible.builtin.command:
    cmd: >-
      lvs --noheadings --nosuffix --units b --separator ,
      --select 'lv_name={{ item._thinpool }} || lv_name={{ item._thinpool }}_vpool0 || pool_lv={{ item._thinpool }}'
      --options lv_name,pool_lv,lv_active,chunk_size,vdo_max_discard {{ item.vg }}
  register: _storage_pool_vdo_discard
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ _storage_pool_convert_thinpools | selectattr('_vdo') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Initialize list of VDO thin pools without discard passdown
  ansible.builtin.set_fact:
    _storage_pool_vdo_nopassdown: []

- name: Build list of VDO thin pools without discard passdown
  ansible.builtin.set_fact:
    _storage_pool_vdo_nopassdown: "{{ _storage_pool_vdo_nopassdown + [item.item | combine({'_chunk_blocks': _chunk_blocks | int})] }}"
  vars:
    _rows: "{{ item.stdout_lines | default([]) | map('trim') | map('split', ',') | list }}"
    _pool_row: "{{ _rows | selectattr('0', 'equalto', item.item._thinpool) | first | default(['', '', '', '0', '']) }}"
    _vdo_pool_rows: "{{ _rows | selectattr('0', 'equalto', item.item._thinpool ~ '_vpool0') | list }}"
    _active_thin_volumes: "{{ _rows | selectattr('1', 'equalto', item.item._thinpool) | selectattr('2', 'equalto', 'active') | list | length }}"
    _chunk_blocks: "{{ (_pool_row[3] | int) // 4096 }}"
  when:
    - _vdo_pool_rows | length > 0
    - _active_thin_volumes | int == 0
    - _vdo_pool_rows[0][4] | int < _chunk_blocks | int
  loop: "{{ _storage_pool_vdo_discard.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Deactivate VDO thin pools without discard passdown
  ansible.builtin.command:
    cmd: lvchange --activate n {{ item.vg }}/{{ item._thinpool }}
  changed_when: true
  loop: "{{ _storage_pool_vdo_nopassdown }}"
  loop_control:
    label: "{{ item.name }}"

- name: Let VDO accept discards of a whole thin pool chunk
  ansible.builtin.command:
    cmd: lvchange --vdosettings max_discard={{ item._chunk_blocks }} {{ item.vg }}/{{ item._thinpool }}_vpool0
  changed_when: true
  loop: "{{ _storage_pool_vdo_nopassdown }}"
  loop_control:
    label: "{{ item.name }}"

- name: Activate VDO thin pools without discard passdown
  ansible.builtin.command:
    cmd: lvchange --activate y {{ item.vg }}/{{ item._thinpool }}
  changed_when: true
  loop: "{{ _storage_pool_vdo_nopassdown }}"
  loop_control:
    label: "{{ item.name }}"
