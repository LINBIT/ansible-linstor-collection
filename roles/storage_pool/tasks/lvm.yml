# SPDX-License-Identifier: MIT
---
- name: Regather hardware facts for LVM
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - hardware

- name: List mount points on storage pool backing disks
  ansible.builtin.command: lsblk --noheadings --raw --output MOUNTPOINT {{ item.1 }}
  when:
    (item.0.vg not in ansible_facts['lvm']['vgs']) or
    (item.0.wipefs_force | default(storage_pool_defaults.wipefs_force) | bool)
  register: _lvm_wipe_mounts
  changed_when: false
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'in', ['lvm', 'lvmthin'])
       | list
       | subelements('physical_devices') }}
  loop_control:
    label: "{{ item.0.name }} - {{ item.1 }}"

- name: Refuse to wipe a disk with a mounted filesystem
  ansible.builtin.fail:
    msg: "Refusing to run wipefs on {{ item.item.1 }}: mounted at {{ item.stdout_lines | select | join(', ') }}. Unmount it first, or pick another disk."
  when: item.stdout_lines | select | list | length > 0
  loop: "{{ _lvm_wipe_mounts.results | selectattr('stdout_lines', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.1 }}"

# Don't wipe out physical volumes if the volume group is already enumerated
- name: Run wipefs on storage pool backing disks
  ansible.builtin.command: wipefs -afq {{ item.1 }}
  when:
    (item.0.vg not in ansible_facts['lvm']['vgs']) or
    (item.0.wipefs_force | default(storage_pool_defaults.wipefs_force) | bool)
  changed_when: true
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'in', ['lvm', 'lvmthin'])
       | list
       | subelements('physical_devices') }}
  loop_control:
    label: "{{ item.0.name }} - {{ item.1 }}"

- name: Create LVM volume group for LINSTOR
  community.general.lvg:
    vg: "{{ item.vg }}"
    pvs: "{{ item.physical_devices }}"
    pv_options: "{{ item.pv_create_options | default(storage_pool_defaults.pv_create_options) }}"
    remove_extra_pvs: false
    state: present
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'in', ['lvm', 'lvmthin'])
       | list }}
  loop_control:
    label: "{{ item.name }}"

# Stripe volumes by default when more than 1 device exists.
# Each vars expression uses a single {{ }} output to avoid jinja2_native
# returning None for empty >- block scalar templates.
- name: Create LVM thin pool for LINSTOR
  community.general.lvol:
    vg: "{{ item.vg }}"
    thinpool: "{{ item.vg_thinpool | default(storage_pool_defaults.vg_thinpool) }}"
    size: "{{ item.thinpool_size | default(storage_pool_defaults.thinpool_size) }}"
    opts: "{{ _lv_opts or omit }}"
    shrink: false
  vars:
    _custom_opts: "{{ (item.lv_create_options | default(storage_pool_defaults.lv_create_options)) | trim }}"
    _stripe_opts: "{{ ('-i ' ~ (item.physical_devices | length | string) ~ ' -I 64') if item.physical_devices | length > 1 else '' }}"
    _lv_opts: "{{ _custom_opts or _stripe_opts }}"
  when: not ansible_check_mode or item.vg in ansible_facts['lvm']['vgs']
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'equalto', 'lvmthin')
       | rejectattr('_vdo')
       | list }}
  loop_control:
    label: "{{ item.name }}"

# lvol cannot convert a VDO volume into a thin pool, and would resize the converted pool on reruns
- name: List logical volumes for VDO thin pools
  ansible.builtin.command:
    cmd: lvs --all --noheadings --separator , --options lv_name,segtype {{ item.vg }}
  register: _storage_pool_vdo_lvs
  changed_when: false
  failed_when: false
  check_mode: false
  loop: >-
    {{ _pools_to_create
       | selectattr('_type', 'equalto', 'lvmthin')
       | selectattr('_vdo')
       | list }}
  loop_control:
    label: "{{ item.name }}"

- name: Initialize VDO thin pool list
  ansible.builtin.set_fact:
    _storage_pool_vdo_thinpools: []

- name: Build VDO thin pool list
  ansible.builtin.set_fact:
    _storage_pool_vdo_thinpools: >-
      {{ _storage_pool_vdo_thinpools + [item.item | combine({
           '_thinpool': _thinpool,
           '_segtype': _segtypes.get(_thinpool, ''),
           '_data_segtype': _segtypes.get(_thinpool ~ '_tdata', '')
         })] }}
  vars:
    _thinpool: "{{ item.item.vg_thinpool | default(storage_pool_defaults.vg_thinpool) }}"
    _segtypes: "{{ dict(item.stdout_lines | map('trim') | map('replace', '[', '') | map('replace', ']', '') | map('split', ',')) }}"
  loop: "{{ _storage_pool_vdo_lvs.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Refuse a VDO thin pool name taken by a volume without VDO
  ansible.builtin.fail:
    msg: >-
      {{ item.vg }}/{{ item._thinpool }} already exists as {{ item._segtype }} without VDO.
      Remove it, or set another vg_thinpool for storage pool '{{ item.name }}'.
  when:
    - item._segtype not in ['', 'vdo']
    - item._segtype != 'thin-pool' or item._data_segtype != 'vdo'
  loop: "{{ _storage_pool_vdo_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create VDO volume for LINSTOR thin pool
  ansible.builtin.command:
    cmd: >-
      lvcreate --yes --type vdo --name {{ item._thinpool }} --vdopool {{ item._thinpool }}_vpool0
      {{ '--extents' if '%' in _size else '--size' }} {{ _size }}
      {{ ('--virtualsize ' ~ _logical_size) if _logical_size | length > 0 else '' }}
      {{ ('--vdosettings slab_size_mb=' ~ ((_slab_size | human_to_bytes) // 1048576)) if _slab_size | length > 0 else '' }}
      {{ _lv_opts }} {{ item.vg }}
  vars:
    _size: "{{ item.thinpool_size | default(storage_pool_defaults.thinpool_size) }}"
    _logical_size: "{{ item.vdo_logical_size | default(storage_pool_defaults.vdo_logical_size | default('')) | string }}"
    _slab_size: "{{ item.vdo_slab_size | default(storage_pool_defaults.vdo_slab_size | default('')) | string }}"
    _custom_opts: "{{ (item.lv_create_options | default(storage_pool_defaults.lv_create_options)) | trim }}"
    _stripe_opts: "{{ ('-i ' ~ (item.physical_devices | length | string) ~ ' -I 64') if item.physical_devices | length > 1 else '' }}"
    _lv_opts: "{{ _custom_opts or _stripe_opts }}"
  when: item._segtype == ''
  changed_when: true
  loop: "{{ _storage_pool_vdo_thinpools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Convert VDO volume to LINSTOR thin pool
  ansible.builtin.command:
    cmd: lvconvert --yes --type thin-pool {{ item.vg }}/{{ item._thinpool }}
  when: item._segtype in ['', 'vdo']
  changed_when: true
  loop: "{{ _storage_pool_vdo_thinpools }}"
  loop_control:
    label: "{{ item.name }}"
