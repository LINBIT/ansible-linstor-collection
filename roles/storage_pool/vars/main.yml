---
_storage_pool_has_pools: "{{ _my_pools | length > 0 }}"
_storage_pool_has_vdo_pools: "{{ _pools_to_create | default([]) | selectattr('_vdo') | list | length > 0 }}"
_storage_pool_zfs_path: >-
  {%- if ansible_facts['os_family'] | lower == 'redhat' -%}
    /sbin/zfs
  {%- else -%}
    /usr/sbin/zfs
  {%- endif -%}
