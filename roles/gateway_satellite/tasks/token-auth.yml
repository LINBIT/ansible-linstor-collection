---
# Wire the linstor-gateway daemon to authenticate against a LINSTOR 1.34+
# controller that has token authentication and REST HTTPS enabled. Runs on the
# gateway serving nodes inside the controller-present block, so the API
# delegate can reach the controller.

- name: Detect controller token-authentication state
  linbit.linstor.controller_info:
  when:
    - _gw_token_auth is not defined
    - gateway_satellite_token_auth == ""
  delegate_to: "{{ linstor_api_delegate }}"
  environment:
    LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"
  register: _gw_ctrl_info

- name: Resolve effective token-authentication flag
  ansible.builtin.set_fact:
    _gw_token_auth: >-
      {{ (gateway_satellite_token_auth | bool)
         if gateway_satellite_token_auth != ""
         else (_gw_ctrl_info.properties['Auth/TokenAuthenticationEnabled']
               | default('false') | bool) }}
  when: _gw_token_auth is not defined

- name: Resolve the gateway token description and controller address
  ansible.builtin.set_fact:
    _gw_token_desc: "linstor-gateway-{{ inventory_hostname }}"
    _gw_controller_addr: "{{ query('linbit.linstor.group_addresses', 'linstor_controllers') | first }}"

- name: Configure daemon credentials when token authentication is enabled
  when: _gw_token_auth | bool
  block:
    - name: Ensure gateway config directory exists
      ansible.builtin.file:
        path: "{{ gateway_satellite_config_dir }}"
        state: directory
        mode: '0755'

    - name: Check for the satellite token the controller distributes
      ansible.builtin.stat:
        path: /var/lib/linstor.d/auth.json
      register: _gw_auth_json

    - name: Check for an existing gateway token file
      ansible.builtin.stat:
        path: "{{ gateway_satellite_config_dir }}/auth-token"
      register: _gw_token_stat

    - name: Create a dedicated gateway token
      when:
        - not _gw_auth_json.stat.exists
        - not _gw_token_stat.stat.exists or gateway_satellite_token_force | bool
      block:
        - name: List existing auth tokens
          linbit.linstor.auth_token_info:
          delegate_to: "{{ linstor_api_delegate }}"
          environment:
            LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"
          register: _gw_tokens

        - name: Remove stale gateway tokens for this node
          linbit.linstor.auth_token:
            state: absent
            tokenid: "{{ item.id }}"
          loop: "{{ _gw_tokens.tokens | selectattr('description', 'equalto', _gw_token_desc) | list }}"
          loop_control:
            label: "{{ item.id }}"
          delegate_to: "{{ linstor_api_delegate }}"
          environment:
            LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"

        - name: Create the gateway token
          linbit.linstor.auth_token:
            state: present
            description: "{{ _gw_token_desc }}"
          delegate_to: "{{ linstor_api_delegate }}"
          environment:
            LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"
          register: _gw_new_token
          no_log: true

        - name: Write the gateway token file
          ansible.builtin.copy:
            content: "{{ _gw_new_token.token }}"
            dest: "{{ gateway_satellite_config_dir }}/auth-token"
            owner: root
            group: root
            mode: '0600'
          no_log: true
          notify: restart_linstor_gateway

    - name: Install provided CA content (standalone or override)
      ansible.builtin.copy:
        content: "{{ gateway_satellite_ca_cert }}"
        dest: "{{ gateway_satellite_config_dir }}/ca.crt"
        mode: '0644'
      when: gateway_satellite_ca_cert != ""
      notify: restart_linstor_gateway

    - name: Check for the ssl_init CA certificate
      ansible.builtin.stat:
        path: "{{ gateway_satellite_ca_cert_file }}"
      register: _gw_ssl_ca
      when: gateway_satellite_ca_cert == ""

    # Without ssl_init, token auth still enables REST HTTPS with a self-signed certificate
    - name: Fetch the controller auto-HTTPS certificate
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import ssl; print(ssl.get_server_certificate(("{{ _gw_controller_addr }}", 3371)))
      when:
        - gateway_satellite_ca_cert == ""
        - not _gw_ssl_ca.stat.exists
      register: _gw_served_cert
      changed_when: false

    - name: Install the controller auto-HTTPS certificate as the trusted CA
      ansible.builtin.copy:
        content: "{{ _gw_served_cert.stdout ~ '\n' }}"
        dest: "{{ gateway_satellite_config_dir }}/ca.crt"
        mode: '0644'
      when:
        - gateway_satellite_ca_cert == ""
        - not _gw_ssl_ca.stat.exists
      notify: restart_linstor_gateway

    - name: Resolve the CA path the daemon trusts
      ansible.builtin.set_fact:
        _gw_ca_path: "{{ gateway_satellite_ca_cert_file
                         if (gateway_satellite_ca_cert == '' and _gw_ssl_ca.stat.exists)
                         else gateway_satellite_config_dir ~ '/ca.crt' }}"

    # The daemon's Go client reads the system pool, so the CA has to be in the OS trust store
    - name: Install the controller CA into the OS trust store
      ansible.builtin.include_role:
        name: linbit.linstor.ssl_init
        tasks_from: install-ca-cert
      vars:
        ssl_init_dir: "{{ _gw_ca_path | dirname }}"
