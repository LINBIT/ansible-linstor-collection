# SPDX-License-Identifier: MIT
---
# Generate a private CA on the Ansible control node.
# The CA key never leaves the control node -- node certs are signed here
# and only the signed cert + node key are pushed to managed nodes.
- name: Create local SSL directory on control node
  ansible.builtin.file:
    path: "{{ ssl_init_local_dir }}"
    state: directory
    mode: '0700'
  run_once: true  # noqa: run-once[task]
  delegate_to: localhost
  become: false

- name: Check for the CA key and certificate on control node
  ansible.builtin.stat:
    path: "{{ ssl_init_local_dir }}/{{ item }}"
  loop:
    - ca.key
    - ca.crt
  register: _ssl_init_ca_files
  run_once: true  # noqa: run-once[task]
  delegate_to: localhost
  become: false

- name: Assert the CA certificate comes with its private key
  ansible.builtin.assert:
    that: >-
      _ssl_init_ca_files.results[0].stat.exists or
      not _ssl_init_ca_files.results[1].stat.exists
    fail_msg: >-
      {{ ssl_init_local_dir }}/ca.crt exists without its ca.key, so this
      control node cannot sign node certificates, and generating a new key
      would not match the certificate. If the cluster already uses this CA,
      copy ca.key from the control node that created it into
      {{ ssl_init_local_dir }} and re-run. If SSL never finished on this
      cluster, remove {{ ssl_init_local_dir }} on this control node and
      {{ ssl_init_dir }} on {{ groups['linstor_controllers'][0] }}, then re-run.
    quiet: true
  run_once: true  # noqa: run-once[task]

# ec_param_enc must follow the curve option - LibreSSL (macOS) defaults to explicit params, which Java rejects
- name: Generate CA private key
  ansible.builtin.command:
    cmd: >-
      openssl genpkey
      -algorithm {{ ssl_init_key_algorithm }}
      -pkeyopt {{ 'ec_paramgen_curve:' + ssl_init_ca_curve if ssl_init_key_algorithm == 'EC' else 'rsa_keygen_bits:' + ssl_init_rsa_key_size | string }}
      {{ '-pkeyopt ec_param_enc:named_curve' if ssl_init_key_algorithm == 'EC' else '' }}
      -out {{ ssl_init_local_dir }}/ca.key
    creates: "{{ ssl_init_local_dir }}/ca.key"
  run_once: true  # noqa: run-once[task]
  delegate_to: localhost
  become: false

- name: Generate self-signed CA certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -new -x509
      -key {{ ssl_init_local_dir }}/ca.key
      -out {{ ssl_init_local_dir }}/ca.crt
      -days {{ ssl_init_ca_validity_days }}
      -subj "/CN={{ ssl_init_ca_name }}{{ '/O=' + ssl_init_cert_o if ssl_init_cert_o else '' }}{{ '/C=' + ssl_init_cert_c if ssl_init_cert_c else '' }}"
      -addext "basicConstraints=critical,CA:TRUE,pathlen:0"
      -addext "keyUsage=critical,keyCertSign,cRLSign"
      -addext "subjectKeyIdentifier=hash"
    creates: "{{ ssl_init_local_dir }}/ca.crt"
  run_once: true  # noqa: run-once[task]
  delegate_to: localhost
  become: false
