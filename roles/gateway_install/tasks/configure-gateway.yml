---
# Only needed when installing from GitHub
- name: Create linstor-gateway systemd service  # noqa: no-handler
  ansible.builtin.copy:
    src: linstor-gateway.service
    dest: /etc/systemd/system/linstor-gateway.service
    mode: '0644'
  when: _gateway_installed_from_github is changed

- name: Create the linstor-gateway config directory
  ansible.builtin.file:
    path: "{{ _gateway_install_config_dir }}"
    state: directory
    mode: '0755'

- name: Detect controller token auth state
  linbit.linstor.controller_info:
  when:
    - gateway_satellite_token_auth | default('') == ''
    - groups.get('linstor_controllers', []) | length > 0
  delegate_to: "{{ linstor_api_delegate }}"
  environment:
    LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"
  register: _gw_ctrl_info

- name: Resolve effective token auth flag
  ansible.builtin.set_fact:
    _gw_token_auth: >-
      {{ (gateway_satellite_token_auth | bool)
         if gateway_satellite_token_auth | default('') != ''
         else (_gw_ctrl_info.properties['Auth/TokenAuthenticationEnabled']
               | default('false') | bool) }}

# Token auth serves the REST API over HTTPS - the plain port only redirects, losing the auth header
- name: Resolve the controller REST API scheme and the daemon token file
  ansible.builtin.set_fact:
    _gateway_install_https: >-
      {{ (linstor_ssl | default(false) | bool)
         or (_gw_token_auth | bool and not (auth_init_no_https | default(false) | bool)) }}
    _gateway_install_token_file: >-
      {{ _gateway_install_config_dir ~ '/auth-token'
         if groups.get('linstor_controllers', []) | length > 0
         else '' }}

- name: Create the daemon's LINSTOR API token
  ansible.builtin.include_tasks: token-auth.yml
  when:
    - _gw_token_auth | bool
    - _gateway_install_token_file != ''

- name: Setup linstor-gateway.toml
  ansible.builtin.template:
    src: linstor-gateway.j2
    dest: "{{ _gateway_install_config_dir }}/linstor-gateway.toml"
    mode: '0644'
  notify: restart_linstor_gateway

- name: Open firewall ports for LINSTOR Gateway
  ansible.builtin.include_tasks: open-firewall.yml
  when: gateway_install_firewall_rules | bool

# Satellite-side components (NFS/iSCSI RAs, packages, Reactor) are only
# needed on satellite nodes. If linstor_gateway_satellites is defined and
# non-empty, restrict to those nodes; otherwise fall back to all linstor_satellites.
- name: Install LINSTOR Gateway satellite components
  ansible.builtin.include_role:
    name: linbit.linstor.gateway_satellite
  vars:
    _gw_satellite_targets: "{{ groups.get('linstor_gateway_satellites', []) or groups.get('linstor_satellites', []) }}"
  when: inventory_hostname in _gw_satellite_targets

- name: Start and enable LINSTOR Gateway service
  ansible.builtin.systemd_service:
    name: linstor-gateway.service
    state: started
    enabled: true

- name: Flush handlers for gateway_install
  ansible.builtin.meta: flush_handlers
