# SPDX-License-Identifier: MIT
---
argument_specs:
  main:
    short_description: Install the linstor-gateway binary and service
    description:
      - >-
        Install the C(linstor-gateway) daemon, deploy its configuration, open firewall port C(8337/tcp),
        and start the service.
      - On satellite nodes, also installs satellite-side components via C(linbit.linstor.gateway_satellite).
    options:
      gateway_install_package_state:
        type: str
        default: present
        choices:
          - latest
          - present
        description:
          - Package state for the C(linstor-gateway) package.
          - Set C(latest) to upgrade, C(present) to skip upgrades.
      gateway_install_from_github:
        type: bool
        default: false
        description:
          - Skip the package manager and install the latest C(linstor-gateway)
            release binary from GitHub.
          - Useful when the package repositories lag behind an upstream release.
      gateway_install_firewall_rules:
        type: bool
        default: true
        description:
          - Manage firewall rules for LINSTOR Gateway ports.
          - Set C(false) to skip firewall configuration.
      gateway_install_firewalld_zone:
        type: str
        default: ""
        description:
          - firewalld zone to open the LINSTOR Gateway ports in.
          - Empty uses the zone firewalld would pick by itself, which is
            the default zone. Set it when a zone is bound to a source,
            because firewalld matches a source before an interface.
          - Ignored by UFW, which has no zones.
      gateway_install_firewall_ports:
        type: list
        elements: dict
        default:
          - port: "8337"
            proto: tcp
        description:
          - Ports to open in firewalld or UFW for LINSTOR Gateway.
      gateway_install_force_reconfigure:
        type: bool
        default: false
        description:
          - Force re-running the configure phase even when the LINSTOR Gateway
            package install reports unchanged.
          - Re-asserts directory, C(linstor-gateway.toml) template, firewall
            ports, and C(linstor-gateway.service) state.
          - Also re-invokes C(linbit.linstor.gateway_satellite) on satellite
            hosts, which transitively re-invokes
            C(linbit.drbd_reactor.reactor_install).
          - Use for drift correction after manual C(systemctl disable) or
            out-of-band config edits.
      linstor_api_delegate:
        type: str
        required: false
        default: localhost
        description:
          - Delegation target for LINSTOR API tasks (python-linstor module calls).
          - Default C(localhost) runs the calls on the Ansible control node.
          - Override to a cluster node when the Ansible control node cannot directly reach the
            LINSTOR controller API endpoint (for example an SSH jump host
            or a segmented management network).
          - "Common override: the first host in the C(linstor_controllers) inventory group."
          - The delegated node must have C(python-linstor) installed.
            Cluster nodes have it via LINSTOR package dependencies.
