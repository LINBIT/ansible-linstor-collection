# SPDX-License-Identifier: MIT
---
- name: Configure LINBIT public repo
  tags:
    - linstor
    - linstor_registration
  ansible.builtin.include_role:
    name: linbit.common.public_repo
    apply:
      tags:
        - linstor
        - linstor_registration
  when: cluster_init_repo_access == 'public'

- name: Configure LINBIT customer repo
  tags:
    - linstor
    - linstor_registration
  ansible.builtin.include_role:
    name: linbit.common.customer_repo
    apply:
      tags:
        - linstor
        - linstor_registration
  when: cluster_init_repo_access == 'customer'

- name: Install LINSTOR satellite
  tags:
    - linstor
    - linstor_installation
  ansible.builtin.include_role:
    name: linbit.linstor.satellite_install
    apply:
      tags:
        - linstor
        - linstor_installation
  when: inventory_hostname in groups['linstor_satellites']

- name: Install LINSTOR controller
  tags:
    - linstor
    - linstor_installation
  ansible.builtin.include_role:
    name: linbit.linstor.controller_install
    apply:
      tags:
        - linstor
        - linstor_installation
  when: inventory_hostname in groups['linstor_controllers']

- name: Detect a LINSTOR controller that check mode only simulated
  tags: always
  ansible.builtin.set_fact:
    _cluster_init_no_controller: >-
      {{ ansible_check_mode
         and groups['linstor_controllers'] | map('extract', hostvars)
             | selectattr('_controller_install_packages', 'defined')
             | map(attribute='_controller_install_packages')
             | select('changed') | list | length > 0 }}
  run_once: true  # noqa: run-once[task]

- name: Configure LINSTOR SSL/TLS
  tags:
    - linstor
    - linstor_ssl
  ansible.builtin.include_role:
    name: linbit.linstor.ssl_init
    apply:
      tags:
        - linstor
        - linstor_ssl
  vars:
    ssl_init_https_mtls: "{{ cluster_init_ssl_mtls }}"
  when:
    - cluster_init_ssl | bool
    - not _cluster_init_no_controller

- name: Register LINSTOR cluster membership
  tags:
    - linstor
    - linstor_cluster_membership
  ansible.builtin.include_role:
    name: linbit.linstor.cluster_membership
    apply:
      tags:
        - linstor
        - linstor_cluster_membership
  when: not _cluster_init_no_controller

# Run after cluster_membership so init distributes tokens for all satellites
- name: Initialize LINSTOR token authentication
  tags:
    - linstor
    - linstor_auth
  ansible.builtin.include_role:
    name: linbit.linstor.auth_init
    apply:
      tags:
        - linstor
        - linstor_auth
  vars:
    auth_init_no_https: "{{ cluster_init_ssl | bool }}"
  when:
    - cluster_init_token_auth | bool
    - not _cluster_init_no_controller

- name: Install LINSTOR Gateway
  tags:
    - linstor
    - linstor_installation
    - linstor_gateway
  ansible.builtin.include_role:
    name: linbit.linstor.gateway_install
    apply:
      tags:
        - linstor
        - linstor_installation
        - linstor_gateway
  when:
    - cluster_init_linstor_gateway | bool
    - not _cluster_init_no_controller

- name: Create LINSTOR storage pools
  tags:
    - linstor
    - linstor_storage_pool
  ansible.builtin.include_role:
    name: linbit.linstor.storage_pool
    apply:
      tags:
        - linstor
        - linstor_storage_pool
  when:
    - cluster_init_deploy_storage | bool
    - not _cluster_init_no_controller

- name: Create LINSTOR resource groups
  tags:
    - linstor
    - linstor_resource_group
  ansible.builtin.include_role:
    name: linbit.linstor.resource_group
    apply:
      tags:
        - linstor
        - linstor_resource_group
  when:
    - cluster_init_deploy_resource_groups | bool
    - not _cluster_init_no_controller

# Requires storage pools to already exist in the cluster
# The role self-detects diskful nodes from a live query and skips when they are absent
- name: Convert LINSTOR database to HA
  tags:
    - linstor
    - linstor_ha_database
  ansible.builtin.include_role:
    name: linbit.linstor.ha_database
    apply:
      tags:
        - linstor
        - linstor_ha_database
  when:
    - cluster_init_ha_database | bool
    - not _cluster_init_no_controller
