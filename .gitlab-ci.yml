# SPDX-License-Identifier: MIT
---
stages:
  - lint
  - test
  - docs

variables:
  COLLECTION_NAMESPACE: linbit
  COLLECTION_NAME: linstor
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCS_PATH: ${COLLECTION_NAMESPACE}.${COLLECTION_NAME}/${CI_COMMIT_REF_SLUG}

# Place the project under ansible_collections/<ns>/<name>/ as ansible-test
# requires. Symlinks do not work here because ansible-test calls
# os.getcwd() which resolves to the real path.
.collection_path: &collection_path
  - mkdir -p /tmp/ansible/ansible_collections/${COLLECTION_NAMESPACE}
  - cp -r "$CI_PROJECT_DIR" /tmp/ansible/ansible_collections/${COLLECTION_NAMESPACE}/${COLLECTION_NAME}
  - rm -rf /tmp/ansible/ansible_collections/${COLLECTION_NAMESPACE}/${COLLECTION_NAME}/.cache
  - cd /tmp/ansible/ansible_collections/${COLLECTION_NAMESPACE}/${COLLECTION_NAME}
  - export ANSIBLE_COLLECTIONS_PATH=/tmp/ansible

# linstor's roles reference linbit.drbd and linbit.drbd_reactor in
# meta/main.yml, which ansible-lint syntax-check tries to resolve.
# Clone the dep collections so the references resolve in CI.
.fetch_linbit_deps: &fetch_linbit_deps
  - git clone --depth 1
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.at.linbit.com/ansible-collections/linbit.drbd.git"
      /tmp/ansible/ansible_collections/linbit/drbd
  - git clone --depth 1
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.at.linbit.com/ansible-collections/linbit.drbd_reactor.git"
      /tmp/ansible/ansible_collections/linbit/drbd_reactor
  - git clone --depth 1
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.at.linbit.com/ansible-collections/linbit.common.git"
      /tmp/ansible/ansible_collections/linbit/common

cache:
  paths:
    - .cache/pip

ansible-lint:
  stage: lint
  image: python:3.13-slim
  before_script:
    - apt-get -qq update && apt-get -qq install -y git
    - *collection_path
    - *fetch_linbit_deps
    - pip install --quiet 'ansible-core>=2.20,<2.21' 'ansible-lint>=25.5.0'
  script:
    - ansible-lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

antsibull-docs:
  stage: lint
  image: python:3.13-slim
  before_script:
    - *collection_path
    - pip install --quiet 'ansible-core>=2.20,<2.21' antsibull-docs
  script:
    - antsibull-docs lint-collection-docs --plugin-docs --validate-collection-refs self .
    # antsibull-docs validates option names in O() but not in C(), where a renamed option goes unnoticed
    - |
      python3 - <<'EOF'
      import glob, re, sys, yaml
      found = False
      for path in sorted(glob.glob('roles/*/meta/argument_specs.yml')):
          text = open(path).read()
          options = set()
          for entry in (yaml.safe_load(text).get('argument_specs') or {}).values():
              options.update((entry or {}).get('options') or {})
          for number, line in enumerate(text.splitlines(), 1):
              for name in re.findall(r'C\(([A-Za-z0-9_]+)\)', line):
                  if name in options:
                      print(f'{path}:{number}: write option {name} as O({name}), not C({name})')
                      found = True
      sys.exit(1 if found else 0)
      EOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.sanity_template: &sanity_template
  stage: test
  before_script:
    - apt-get -qq update && apt-get -qq install -y git
    - *collection_path
    - pip install --quiet "ansible-core${ANSIBLE_CORE_SPEC}"
  script:
    - ansible-test sanity
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

sanity:ansible-2.16:
  <<: *sanity_template
  image: python:3.12-slim
  variables:
    ANSIBLE_CORE_SPEC: ">=2.16,<2.17"

sanity:ansible-2.18:
  <<: *sanity_template
  image: python:3.13-slim
  variables:
    ANSIBLE_CORE_SPEC: ">=2.18,<2.19"

sanity:ansible-2.20:
  <<: *sanity_template
  image: python:3.13-slim
  variables:
    ANSIBLE_CORE_SPEC: ">=2.20,<2.21"

# The docs come only from plugin docs, role argument specs and collection metadata
.docs_rules: &docs_rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'
    changes:
      - plugins/**/*
      - roles/*/meta/argument_specs.yml
      - galaxy.yml
      - meta/runtime.yml
      - .gitlab-ci.yml

docs:build:
  stage: docs
  image: python:3.13-slim
  needs: []
  before_script:
    - *collection_path
    - pip install --quiet 'ansible-core>=2.20,<2.21' antsibull-docs
  script:
    - mkdir /tmp/docsite
    # Pulp serves no page at the server root, where the theme's logo links by default
    - antsibull-docs sphinx-init --use-current --squash-hierarchy --fail-on-error
        --project "${COLLECTION_NAMESPACE}.${COLLECTION_NAME}" --copyright LINBIT
        --extra-html-theme-options "documentation_home_url=$LINBIT_PULP_BASE_URL/pulp/content/file/pages/$DOCS_PATH/index.html"
        --dest-dir /tmp/docsite ${COLLECTION_NAMESPACE}.${COLLECTION_NAME}
    - pip install --quiet -r /tmp/docsite/requirements.txt
    - /tmp/docsite/build.sh
    - cp -r /tmp/docsite/build/html "$CI_PROJECT_DIR/public"
  artifacts:
    paths:
      - public/
  rules: *docs_rules

docs:publish:
  stage: docs
  image: $LINBIT_DOCKER_REGISTRY/build-helpers:latest
  needs:
    - docs:build
  environment:
    name: docs/$CI_COMMIT_REF_SLUG
    url: $LINBIT_PULP_BASE_URL/pulp/content/file/pages/${COLLECTION_NAMESPACE}.${COLLECTION_NAME}/$CI_COMMIT_REF_SLUG/index.html
  script:
    - . gitlab-utils.sh
    - ci_prepare_tools
    # Fetch and cache the Pulp API schema once before uploading in parallel
    - pulp status > /dev/null
    - |
      set -o pipefail
      cd public
      find . -type f -printf '%P\n' \
        | parallel --halt now,fail=1 --jobs 8 \
            pulp file content upload --file {} --relative-path "$DOCS_PATH/{}" \
        | jq --slurp 'map({sha256, relative_path})' > "$CI_PROJECT_DIR/docs-content.json"
      pulp file repository content modify --repository pages --add-content "@$CI_PROJECT_DIR/docs-content.json"
  rules: *docs_rules
