---
# Verify the names, addresses, IQNs, NQNs and export paths the
# linbit.linstor.gateway_targets filter gives ha_gateway targets.
# Runs on the control node only, no cluster needed:
#   ansible-playbook ./test_gateway_targets.yaml
#
# Tests:
#   1. iSCSI: the name is kept as given, the default IQN uses it, an
#      explicit IQN names the resource, target_port wins over the default
#      port, service IPs lose their prefix
#   2. NFS: a name starting with the protocol stays as given, like
#      linstor-gateway nfs create, one export path per exports entry under
#      /srv/gateway-exports, without a trailing slash for /
#   3. NVMe-oF: the default NQN and port
#   4. state defaults to present
#   5. An iSCSI WWN with '_' and an NQN without three parts fail
#   6. platform_storage: true stays true, a list and a dict become a dict,
#      false stays false, absent becomes null, a whitespace-only name
#      means the default name, and each form yields its Aux properties
#   7. Invalid platform_storage values fail

- name: Test the gateway_targets filter
  hosts: localhost
  gather_facts: false
  vars:
    iscsi:
      - name: web
        service_ips: [192.168.222.240/24]
        volumes: [{size: 1G}]
        platform_storage: 'yes'
      - name: database
        iqn: iqn.2026-06.com.example:db
        target_port: 3261
        service_ips: [192.168.222.241, 10.0.0.241/8]
        volumes: [{size: 1G}]
        state: absent
        platform_storage: false
    nfs:
      - name: nfs-shared
        service_ips: [192.168.222.242/24]
        exports:
          - {size: 1G}
          - {size: 1G, path: /data}
        platform_storage: [system, image]
    nvmeof:
      - name: fast
        service_ips: [192.168.222.243/24]
        volumes: [{size: 1G}]
        platform_storage: {system: fast_vms, image: '  ', backup: null}
      - name: slow
        service_ips: [192.168.222.244/24]
        volumes: [{size: 1G}]
    iscsi_out: "{{ iscsi | linbit.linstor.gateway_targets('iscsi') }}"
    nfs_out: "{{ nfs | linbit.linstor.gateway_targets('nfs') }}"
    nvmeof_out: "{{ nvmeof | linbit.linstor.gateway_targets('nvmeof') }}"
  tasks:
    - name: Test 1 - iSCSI names, IQNs, ports and addresses
      ansible.builtin.assert:
        that:
          - iscsi_out[0].name == 'web'
          - iscsi_out[0].resource == 'web'
          - iscsi_out[0].iqn == 'iqn.2026-06.com.linbit:web'
          - iscsi_out[0].port == 3260
          - iscsi_out[0].address == '192.168.222.240'
          - iscsi_out[1].name == 'database'
          - iscsi_out[1].resource == 'db'
          - iscsi_out[1].port == 3261
          - iscsi_out[1].service_ips == ['192.168.222.241', '10.0.0.241']

    - name: Test 2 - NFS names and export paths
      ansible.builtin.assert:
        that:
          - nfs_out[0].name == 'nfs-shared'
          - nfs_out[0].resource == 'nfs-shared'
          - nfs_out[0].port == 2049
          - nfs_out[0].exports | map(attribute='export') | list
            == ['/srv/gateway-exports/nfs-shared', '/srv/gateway-exports/nfs-shared/data']

    - name: Test 3 - NVMe-oF NQN and port
      ansible.builtin.assert:
        that:
          - nvmeof_out[0].nqn == 'nqn.2026-06.io.linbit:nvme:fast'
          - nvmeof_out[0].resource == 'fast'
          - nvmeof_out[0].port == 4420

    - name: Test 4 - state
      ansible.builtin.assert:
        that:
          - iscsi_out[0].state == 'present'
          - iscsi_out[1].state == 'absent'

    - name: Test 5 - iSCSI WWN with an underscore fails
      block:
        - name: Normalize an iSCSI target whose WWN has an underscore
          ansible.builtin.set_fact:
            _bad_wwn: "{{ [{'name': 'iscsi_web'}] | linbit.linstor.gateway_targets('iscsi') }}"

        - name: Fail when the WWN was accepted
          ansible.builtin.fail:
            msg: The filter accepted the WWN iscsi_web
      rescue:
        - name: Confirm the WWN message
          ansible.builtin.assert:
            that: "'which LINSTOR Gateway rejects' in ansible_failed_result.msg"

    - name: Test 5 - NQN without three parts fails
      block:
        - name: Normalize an NVMe-oF target with a two-part NQN
          ansible.builtin.set_fact:
            _bad_nqn: "{{ [{'name': 'fast', 'nqn': 'nqn.2026-06.io.linbit:fast'}] | linbit.linstor.gateway_targets('nvmeof') }}"

        - name: Fail when the NQN was accepted
          ansible.builtin.fail:
            msg: The filter accepted the NQN nqn.2026-06.io.linbit:fast
      rescue:
        - name: Confirm the NQN message
          ansible.builtin.assert:
            that: "'three' in ansible_failed_result.msg"

    - name: Test 6 - platform_storage as null, a boolean, or a dict
      ansible.builtin.assert:
        that:
          - iscsi_out[0].platform_storage is true
          - iscsi_out[1].platform_storage is false
          - "nfs_out[0].platform_storage == {'system': '', 'image': ''}"
          - nfs_out[0].platform_storage | list == ['system', 'image']
          - "nvmeof_out[0].platform_storage == {'system': 'fast_vms', 'image': '', 'backup': ''}"
          - nvmeof_out[1].platform_storage is none
          - (iscsi_out + nfs_out + nvmeof_out) | selectattr('platform_storage') | map(attribute='name') | list
            == ['web', 'nfs-shared', 'fast']

    - name: Test 6 - platform_storage properties
      ansible.builtin.assert:
        that:
          - "iscsi_out[0].platform_storage | linbit.linstor.platform_storage_properties
            == {'Aux/PlatformStorage': 'True'}"
          - iscsi_out[1].platform_storage | linbit.linstor.platform_storage_properties == {}
          - "nfs_out[0].platform_storage | linbit.linstor.platform_storage_properties
            == {'Aux/PlatformStorage': 'system,image'}"
          - "nvmeof_out[0].platform_storage | linbit.linstor.platform_storage_properties
            == {'Aux/PlatformStorage': 'system,image,backup', 'Aux/PlatformStorage/system/Name': 'fast_vms'}"
          - "{'image': 'golden', 'system': none} | linbit.linstor.platform_storage_properties
            == {'Aux/PlatformStorage': 'image,system', 'Aux/PlatformStorage/image/Name': 'golden'}"
          - "['system'] | linbit.linstor.platform_storage_properties == {'Aux/PlatformStorage': 'system'}"
          - none | linbit.linstor.platform_storage_properties == {}
          - false | linbit.linstor.platform_storage_properties == {}

    - name: Test 7 - invalid platform_storage values fail
      ansible.builtin.include_tasks: platform-storage-invalid.yml
      loop:
        - value: system
          message: is the string
        - value: 1
          message: 'is 1'
        - value: []
          message: has no keys
        - value: {}
          message: has no keys
        - value: ['sys/tem']
          message: "without '/'"
        - value: ['sys,tem']
          message: "without '/'"
        - value: ['sys tem']
          message: "without '/'"
        - value: ['']
          message: "without '/'"
        - value: [1]
          message: "without '/'"
        - value: {system: 5}
          message: has the invalid name
        - value: {system: [a]}
          message: has the invalid name
        - value: ['True']
          message: reads as a boolean
        - value: ['yes']
          message: reads as a boolean
        - value: ['1']
          message: reads as a boolean
        - value: {'on': fast_vms}
          message: reads as a boolean
        - value: ["system\n"]
          message: "without '/'"
      loop_control:
        loop_var: invalid
        label: "{{ invalid.value }}"
