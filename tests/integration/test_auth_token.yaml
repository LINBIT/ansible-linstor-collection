---
# Verify token authentication state of a deployed LINSTOR cluster after
# auth_init has run.
# Expects standard LINSTOR inventory groups (linstor_cluster,
# linstor_controllers, linstor_satellites).
# Run after deploying with cluster_init_token_auth=true against LINSTOR 1.34.0 or later:
#   ansible-playbook ./test_auth_token.yaml
#
# Tests:
#   1. Satellite token file was distributed to every satellite
#   2. REST API rejects unauthenticated requests (401)
#   3. Control node linstor-client.conf carries an auth-token
#   4. LINSTOR controller module reaches the API with the saved token
#   5. Token authentication is enabled in the controller properties
#   6. A user token exists in the token list
#   7. Every node running the LINSTOR Gateway daemon, controller-only nodes
#      included, has its own 0600 token set as token_file, the token
#      authenticates to the controller, and the daemon reaches the controller
#   8. The daemon still authenticates after a controller restart, which
#      replaces the satellite tokens
#   9. Daemon nodes without a CA trust the controller certificate through the
#      LS_ROOT_CA drop-in, and nodes with a CA have no drop-in
#
# The satellite token file mode is a controller-side concern, verified
# separately, not asserted here.
# Tests 7 to 9 skip nodes that do not run the linstor-gateway daemon, so they
# are no-ops on clusters without LINSTOR Gateway. Test 8 restarts only a
# standalone controller.

- name: Verify satellite token file permissions
  hosts: linstor_satellites
  any_errors_fatal: true
  become: true
  gather_facts: false

  tasks:
    - name: Stat the satellite token file
      ansible.builtin.stat:
        path: /var/lib/linstor.d/auth.json
      register: _auth_json_stat

    - name: Assert the satellite token file exists
      ansible.builtin.assert:
        that:
          - _auth_json_stat.stat.exists
        fail_msg: >-
          /var/lib/linstor.d/auth.json is missing on {{ inventory_hostname }}.
          auth_init should have distributed a satellite token to every
          connected satellite.
        quiet: true

- name: Verify token authentication and connectivity
  hosts: linstor_controllers[0]
  any_errors_fatal: true
  gather_facts: false
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:
    # =================================================================
    # REST API rejects unauthenticated requests
    # =================================================================
    # HA clusters promote linstor-controller on one node at a time, so
    # 3371 only answers on the promoted node. Probe all, require >= 1
    # that returns 401 without a token.
    - name: Probe controller HTTPS endpoint without a token
      ansible.builtin.uri:
        url: "https://{{ hostvars[item]['linstor_ip'] | default(hostvars[item]['ansible_host']) }}:3371/v1/nodes"
        validate_certs: false
        status_code: [401, -1]
      register: _unauth_probe
      failed_when: false
      loop: "{{ groups['linstor_controllers'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert at least one controller rejected the unauthenticated request with 401
      ansible.builtin.assert:
        that:
          - _unauth_probe.results | selectattr('status', 'eq', 401) | list | length >= 1
        fail_msg: >-
          No controller returned 401 for an unauthenticated /v1/nodes request.
          Token authentication may not be enabled.
        quiet: true

    # =================================================================
    # Control node: linstor-client.conf carries an auth-token
    # =================================================================
    - name: Read linstor-client.conf on control node
      ansible.builtin.slurp:
        src: "{{ linstor_client_config_file | default('~/.config/linstor/linstor-client.conf') }}"
      register: _client_conf

    - name: Assert linstor-client.conf carries an auth-token
      ansible.builtin.assert:
        that:
          - "'auth-token' in (_client_conf.content | b64decode)"
        fail_msg: >-
          {{ linstor_client_config_file | default('~/.config/linstor/linstor-client.conf') }} has no auth-token entry.
          auth_init may not have saved the token to the control node config.
        quiet: true

    # =================================================================
    # Module connectivity: API reachable with the saved token
    # =================================================================
    - name: Read controller properties with the saved token
      linbit.linstor.controller_info:
      register: _ctrl_info
      environment:
        LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"

    - name: Assert token authentication is enabled
      ansible.builtin.assert:
        that:
          - _ctrl_info.properties['Auth/TokenAuthenticationEnabled'] | default('false') | bool
        fail_msg: >-
          Auth/TokenAuthenticationEnabled is not true in the controller
          properties. auth_init did not enable token authentication.
        quiet: true

    # =================================================================
    # A user token exists
    # =================================================================
    - name: List auth tokens
      linbit.linstor.auth_token_info:
      register: _tokens
      environment:
        LS_CONTROLLERS: "{{ lookup('linbit.linstor.controller_env') }}"

    - name: Assert at least one user token exists
      ansible.builtin.assert:
        that:
          - _tokens.tokens | selectattr('is_user_token') | list | length >= 1
        fail_msg: >-
          No user token found in the token list. auth_init should have created
          the initial user token.
        quiet: true

- name: Verify the LINSTOR Gateway daemon authenticates under token authentication
  hosts: linstor_cluster
  any_errors_fatal: true
  become: true
  gather_facts: false

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify the gateway daemon has its own token and reaches the controller
      when:
        - ansible_facts.services['linstor-gateway.service'] is defined
        - ansible_facts.services['linstor-gateway.service'].state == 'running'
      block:
        - name: Stat the gateway auth-token file
          ansible.builtin.stat:
            path: /etc/linstor-gateway/auth-token
          register: _gw_token_stat

        - name: Read linstor-gateway.toml
          ansible.builtin.slurp:
            src: /etc/linstor-gateway/linstor-gateway.toml
          register: _gw_toml

        - name: Assert the daemon has a private token file and uses it
          ansible.builtin.assert:
            that:
              - _gw_token_stat.stat.exists
              - _gw_token_stat.stat.mode == '0600'
              - "'token_file = \"/etc/linstor-gateway/auth-token\"' in (_gw_toml.content | b64decode)"
            fail_msg: >-
              The linstor-gateway daemon on {{ inventory_hostname }} has no private token.
              gateway_install should create /etc/linstor-gateway/auth-token (mode 0600)
              and set token_file on every node that runs the daemon.
            quiet: true

        - name: Read the gateway token
          ansible.builtin.slurp:
            src: /etc/linstor-gateway/auth-token
          register: _gw_token
          no_log: true

        # HA clusters answer on the promoted controller only, so require one 200
        - name: Call the controller REST API with the gateway token
          ansible.builtin.uri:
            url: "https://{{ hostvars[item]['linstor_ip'] | default(hostvars[item]['ansible_host']) }}:3371/v1/nodes"
            headers:
              Authorization: "Bearer {{ _gw_token.content | b64decode | trim }}"
            validate_certs: false
            status_code: [200, -1]
          loop: "{{ groups['linstor_controllers'] }}"
          loop_control:
            label: "{{ item }}"
          register: _gw_token_probe
          failed_when: false
          no_log: true

        - name: Assert the gateway token authenticates to the controller
          ansible.builtin.assert:
            that: _gw_token_probe.results | selectattr('status', 'eq', 200) | list | length >= 1
            fail_msg: "No controller accepted the gateway token from {{ inventory_hostname }}"
            quiet: true

        # A zero exit proves the daemon authenticated to the controller: the CLI
        # proxies to the local daemon, which makes the token auth REST call
        - name: List iSCSI targets through the gateway daemon
          ansible.builtin.command: linstor-gateway iscsi list
          register: _gw_list
          changed_when: false
          failed_when: _gw_list.rc != 0

- name: Restart the controller, which replaces the satellite tokens
  hosts: linstor_controllers[0]
  any_errors_fatal: true
  become: true
  gather_facts: false

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    # An HA controller runs under DRBD Reactor, where a plain restart fails over instead
    - name: Restart the standalone controller
      ansible.builtin.systemd_service:
        name: linstor-controller.service
        state: restarted
      when:
        - ansible_facts.services['linstor-controller.service'] is defined
        - ansible_facts.services['linstor-controller.service'].status == 'enabled'

    - name: Wait for the controller API after the restart
      ansible.builtin.command: linstor --no-color node list
      register: _ctrl_up
      changed_when: false
      until: _ctrl_up.rc == 0
      retries: 24
      delay: 5

- name: Verify the gateway daemon still authenticates after the controller restart
  hosts: linstor_cluster
  any_errors_fatal: true
  become: true
  gather_facts: false

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: List iSCSI targets through the gateway daemon after the restart
      ansible.builtin.command: linstor-gateway iscsi list
      when:
        - ansible_facts.services['linstor-gateway.service'] is defined
        - ansible_facts.services['linstor-gateway.service'].state == 'running'
      register: _gw_list_after
      changed_when: false
      until: _gw_list_after.rc == 0
      retries: 6
      delay: 5

- name: Verify how the gateway daemon trusts the controller certificate
  hosts: linstor_cluster
  any_errors_fatal: true
  become: true
  gather_facts: false

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Read linstor-gateway.toml
      ansible.builtin.slurp:
        src: /etc/linstor-gateway/linstor-gateway.toml
      register: _gw_toml
      when: ansible_facts.services['linstor-gateway.service'] is defined

    - name: Check the CA and drop-in on a gateway daemon node talking HTTPS
      when:
        - ansible_facts.services['linstor-gateway.service'] is defined
        - "'https://' in (_gw_toml.content | b64decode)"
      block:
        - name: Check for a CA the daemon trusts
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /etc/linstor-gateway/ca.crt
            - /etc/linstor/ssl/ca.crt
          register: _gw_ca_files

        - name: Read the daemon unit properties
          ansible.builtin.systemd_service:
            name: linstor-gateway.service
          register: _gw_unit

        - name: Assert the drop-in matches the CA state
          ansible.builtin.assert:
            that: >-
              ('LS_ROOT_CA=-----BEGIN CERTIFICATE-----' in (_gw_unit.status.Environment | default('')))
              == (_gw_ca_files.results | selectattr('stat.exists') | list | length == 0)
            fail_msg: >-
              {{ inventory_hostname }} has
              {{ 'no CA and no' if _gw_ca_files.results | selectattr('stat.exists') | list | length == 0 else 'a CA and an' }}
              LS_ROOT_CA drop-in for linstor-gateway
            quiet: true
